<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>User Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>User Lookup</h2>
      <form id="userForm">
        <label>User ID<input id="userId" type="text" placeholder="Enter ID or scan QR"></label>
        <button type="submit">Lookup</button>
      </form>
      <div id="userResult" style="margin-top:12px"></div>
    </div>
  </div>
  <script>
    document.getElementById('userForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const id = document.getElementById('userId').value.trim();
      if(!id) return alert('Enter id');
      try{
        const res = await fetch('/api/users/' + encodeURIComponent(id));
        if(!res.ok) return alert('Not found');
        const user = await res.json();
        document.getElementById('userResult').innerHTML = `<div><strong>${user.name}</strong><br><img src="${user.image || ''}" style="max-width:160px"></div>`;
      }catch(err){ alert('Error: '+err.message) }
    });
  </script>
</body>
</html>
